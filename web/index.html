<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DixitGenerator</title>
  <link rel="stylesheet" href="/web/app.css">
</head>
<body>
  <header>
    <div class="head-left">
      <h1>DixitGenerator</h1>
      <p class="sub" id="spec-line">Loading the print spec…</p>
    </div>
    <div class="head-right">
      <label class="file-button">
        Add cards
        <input type="file" id="file-input" accept="image/*" multiple hidden>
      </label>
      <input type="text" id="upload-tag" placeholder="tag new uploads…" title="Applied to every file in the next drop or pick">
    </div>
  </header>

  <div class="toolbar">
    <input type="search" id="filter-q" placeholder="Search names and notes">
    <select id="filter-tag"><option value="">All tags</option></select>
    <span class="spacer"></span>
    <span id="selection-count" class="count">0 cards</span>
    <button type="button" id="select-all" class="ghost">Select all</button>
    <button type="button" id="select-none" class="ghost">Clear</button>
    <button type="button" id="export-open" class="primary" disabled>Export…</button>
  </div>

  <main>
    <section id="editor" class="panel editor" hidden></section>
    <section id="grid" class="grid"></section>

    <section class="panel">
      <h2>
        Backs
        <label class="file-button small">
          Add a back
          <input type="file" id="back-input" accept="image/*" multiple hidden>
        </label>
      </h2>
      <p class="note">
        A back applies to a whole exported batch. Kept apart from the cards on
        purpose — a back is not a playable card.
      </p>
      <div id="backs" class="backs"></div>
    </section>
  </main>

  <div id="export-dialog" class="dialog" hidden>
    <div class="dialog-panel" role="dialog" aria-modal="true" aria-label="Export">
      <h2>Export a batch</h2>
      <div id="export-body"></div>
      <div class="dialog-actions">
        <button type="button" id="export-run" class="primary">Write the PDF</button>
        <button type="button" id="export-close" class="ghost">Cancel</button>
      </div>
    </div>
  </div>

  <div class="drop-hint">Drop images to add them</div>

  <script type="module" src="/web/app.js"></script>
</body>
</html>
